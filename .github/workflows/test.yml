name: test
on:
  pull_request:
  push:
    branches: [main]

jobs:
  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # the shared test harness, from ../deadbeat-spec
      - uses: actions/checkout@v4
        with:
          repository: manuelnagele/deadbeat-spec
          path: deadbeat-spec
      - name: Install LuaJIT
        run: sudo apt-get update -qq && sudo apt-get install -y -qq luajit
      - name: Smoke test
        run: HARNESS=deadbeat-spec/harness/wowstub.lua luajit tests/smoke.lua
      - name: LDB bridge
        run: HARNESS=deadbeat-spec/harness/wowstub.lua luajit tests/broker.lua
